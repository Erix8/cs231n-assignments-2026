name: cs231n
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      # --- assignment 1 (CPU only) ---
      - numpy
      - scipy
      - matplotlib
      - jupyter
      - pillow
      # data_utils.py uses `from imageio import imread`, which was removed in imageio 3.x
      - "imageio<3"
      # assignment 1/2 legacy python2-compat imports (past.builtins / six.moves)
      - future
      - six

      # --- assignment 2 ---
      - torch
      - torchvision
      - tqdm
      # assignment 2 ConvolutionalNetworks: `python setup.py build_ext --inplace`
      - Cython
      - setuptools
      # COCO captioning dataset loader (coco_utils.py)
      - h5py

      # --- assignment 3 ---
      - joblib            # DDPM emoji dataset
      - einops            # DDPM unet.py
      - thop              # SelfSupervisedLearning (FLOPs/params)
      - pandas            # SelfSupervisedLearning (simclr/utils.py)
      - scikit-learn      # CLIPDINO (PCA)
      - opencv-python     # CLIPDINO (video writing)
      # openai CLIP, needed by DDPM and CLIPDINO (installs ftfy/regex automatically)
      - git+https://github.com/openai/CLIP.git
      # heavy deps, only needed for CLIPDINO.ipynb (DAVIS video dataset via TFDS)
      - tensorflow
      - tensorflow-datasets
      # required by tensorflow-datasets >= 4.9 with the current etils (else:
      # "ModuleNotFoundError: No module named 'importlib_resources'")
      - importlib_resources

      # collect_submission
      - PyPDF2
